   <i class="beam"></i><i class="floor"></i><i class="spark s1"></i><i class="spark s2"></i><i class="spark s3"></i>
   <img id="i1" alt="">

 </section>

 <section class="panel">
  <div class="seg" id="modeSeg" style="--n:3;--i:0"><i class="seg-i"></i>
   <button class="on" id="mdc" data-a="pm" data-i="c">Классик</button>
   <button id="mdd" data-a="pm" data-i="d">Дудл</button>
   <button id="mdm" data-a="pm" data-i="m">Марио</button>
  </div>
  <div class="plr">
   <button class="play" id="playBtn" data-a="playsel"><span>Играть</span><svg aria-hidden="true"><use href="#i-play"/></svg></button>
   <button class="mpb" data-a="mp" aria-label="Мультиплеер"><svg aria-hidden="true"><use href="#i-people"/></svg></button>
  </div>
 </section>
 <div class="card" hidden><p id="qt"></p><i id="qn"></i></div>
</main>
